<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Thư Viện Sách{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ===== Reset & Base ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f1117;
      --surface:   #1a1d27;
      --surface2:  #222535;
      --border:    #2e3248;
      --accent:    #6c63ff;
      --accent2:   #a78bfa;
      --green:     #22c55e;
      --red:       #ef4444;
      --text:      #e2e8f0;
      --muted:     #94a3b8;
      --radius:    12px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a { color: var(--accent2); text-decoration: none; transition: color .2s; }
    a:hover { color: #fff; }

    /* ===== Navbar ===== */
    nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      display: flex;
      align-items: center;
      gap: 2rem;
      height: 60px;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(8px);
    }
    .nav-brand {
      font-weight: 700;
      font-size: 1.1rem;
      color: #fff;
      display: flex;
      align-items: center;
      gap: .5rem;
    }
    .nav-brand span { font-size: 1.3rem; }
    .nav-links { display: flex; gap: 1.5rem; }
    .nav-links a {
      color: var(--muted);
      font-size: .9rem;
      font-weight: 500;
      padding: .3rem .6rem;
      border-radius: 6px;
      transition: background .2s, color .2s;
    }
    .nav-links a:hover,
    .nav-links a.active { background: var(--surface2); color: var(--text); }
    .nav-api { margin-left: auto; display: flex; gap: .75rem; }
    .nav-api a {
      color: var(--muted);
      font-size: .78rem;
      font-family: monospace;
      padding: .25rem .5rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      transition: border-color .2s, color .2s;
    }
    .nav-api a:hover { border-color: var(--accent); color: var(--accent2); }

    /* ===== Main content ===== */
    main { flex: 1; padding: 2.5rem 2rem; max-width: 1100px; margin: 0 auto; width: 100%; }

    /* ===== Cards ===== */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
    }

    /* ===== Badges ===== */
    .badge {
      display: inline-block;
      padding: .2rem .65rem;
      border-radius: 99px;
      font-size: .75rem;
      font-weight: 600;
    }
    .badge-green { background: rgba(34,197,94,.15); color: var(--green); }
    .badge-red   { background: rgba(239,68,68,.15);  color: var(--red); }
    .badge-purple{ background: rgba(108,99,255,.2);  color: var(--accent2); }

    /* ===== Table ===== */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th {
      background: var(--surface2);
      color: var(--muted);
      font-weight: 600;
      font-size: .8rem;
      text-transform: uppercase;
      letter-spacing: .05em;
      padding: .75rem 1rem;
      text-align: left;
    }
    td { padding: .75rem 1rem; border-top: 1px solid var(--border); }
    tr:hover td { background: var(--surface2); }

    /* ===== Buttons ===== */
    .btn {
      display: inline-block;
      padding: .45rem 1rem;
      border-radius: 8px;
      font-size: .85rem;
      font-weight: 500;
      cursor: pointer;
      transition: opacity .2s, transform .15s;
      border: none;
    }
    .btn:hover { opacity: .88; transform: translateY(-1px); }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .btn-outline:hover,
    .btn-outline.active { border-color: var(--accent); color: var(--accent2); background: rgba(108,99,255,.1); }

    /* ===== Footer ===== */
    footer {
      text-align: center;
      padding: 1rem;
      color: var(--muted);
      font-size: .8rem;
      border-top: 1px solid var(--border);
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>

<nav>
  <div class="nav-brand">
    <span>📚</span> Thư Viện Sách
  </div>
  <div class="nav-links">
    <a href="{{ url_for('index') }}"
       class="{{ 'active' if request.endpoint == 'index' }}">Trang chủ</a>
    <a href="{{ url_for('books') }}"
       class="{{ 'active' if request.endpoint in ('books', 'book_detail') }}">Sách</a>
  </div>
  <div class="nav-api">
    <a href="{{ url_for('api_books') }}" target="_blank">/api/books</a>
  </div>
</nav>

<main>
  {% block content %}{% endblock %}
</main>

<footer>
  &copy; 2026 Thư Viện Sách &mdash; Flask Demo
</footer>

</body>
</html>
