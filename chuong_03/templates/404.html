{% extends "base.html" %}
{% block title %}404 – Không Tìm Thấy{% endblock %}

{% block extra_head %}
<style>
  .error-page {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    min-height: 60vh;
    gap: 1.25rem;
  }
  .error-code {
    font-size: 8rem;
    font-weight: 800;
    line-height: 1;
    background: linear-gradient(135deg, #6c63ff, #ef4444, #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .error-page h1 {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--text);
  }
  .error-message {
    color: var(--muted);
    font-size: 1rem;
    max-width: 480px;
    line-height: 1.6;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem 1.5rem;
    font-family: monospace;
  }
  .error-actions { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }
</style>
{% endblock %}

{% block content %}
<div class="error-page">
  <div class="error-code">404</div>
  <h1>Trang không tìm thấy</h1>
  <p class="error-message">{{ message | e }}</p>
  <div class="error-actions">
    <a href="{{ url_for('index') }}" class="btn btn-primary">🏠 Về trang chủ</a>
    <a href="{{ url_for('books') }}" class="btn btn-outline">📚 Xem danh sách sách</a>
  </div>
</div>
{% endblock %}
